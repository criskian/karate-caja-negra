plugins {
    id 'java'
}

group = 'com.cajanegra'
version = '1.0.0'

repositories {
    mavenCentral()
}

ext {
    karateVersion = '1.4.1'
}

dependencies {
    testImplementation "com.intuit.karate:karate-junit5:${karateVersion}"
    testImplementation "ch.qos.logback:logback-classic:1.5.6"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    // Solo se propagan las propiedades que realmente vienen por CLI
    // (evita pasar el literal "null" a Karate cuando no se definen).
    // Filtrar por tags:   -Dkarate.options="--tags @GH-1"
    // Cambiar ambiente:   -DbaseUrl=http://localhost:3000/api
    ['karate.options', 'baseUrl'].each { name ->
        if (System.getProperty(name)) {
            systemProperty name, System.getProperty(name)
        }
    }

    // Los reportes de Karate quedan en target/ y no se reutilizan resultados viejos
    outputs.upToDateWhen { false }
    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = false
    }
}

clean {
    delete 'target'
}
